algorithm: ssfl
backbone: cnn
batch_size: 16
checkpoint_interval: 1
checkpoint_rounds:
- 1
- 2
client_num_cpus: 1.0
client_num_gpus: 0.0
data_path: artifacts/data
deterministic: true
device: cpu
dsfl_temperature: 0.1
learning_rate: 0.0001
local_epochs: 1
logging_interval: 1
max_concurrent_clients: 8
num_server_rounds: 2
output_path: artifacts/runs
paper_text_batch: false
profile: smoke_threshold_0_8
resume_from: null
run_kind: extension
scenario: 1
seed: 2023
ssfl_discriminator_mode: enabled
ssfl_label_representation: hard
ssfl_soft_label_round_decimals: null
ssfl_threshold_policy: fixed_0_8
ssfl_voting_mode: enabled
