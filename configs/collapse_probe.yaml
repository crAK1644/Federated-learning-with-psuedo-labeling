# Collapse-probe profile: paper.yaml truncated to 50 rounds.
# The gafgyt.tcp/gafgyt.udp consensus merge locks in at round 3-10 in every scenario (report
# Table T21, "Cons cl rd" = 4/10/3), so the remaining 150 rounds add nothing to a mitigation
# ablation and cost ~4x the wall clock. Everything else is identical to paper.yaml.
profile: collapse_probe
run_kind: paper
algorithm: ssfl
backbone: cnn
scenario: 1
seed: 2023

data_path: artifacts/data
output_path: artifacts/runs

num_server_rounds: 50
local_epochs: 5
batch_size: 80
paper_text_batch: false
learning_rate: 1.0e-4
device: cuda
deterministic: true

ssfl_threshold_policy: median
ssfl_discriminator_mode: enabled
ssfl_voting_mode: enabled
ssfl_label_representation: hard
ssfl_soft_label_round_decimals: null
ssfl_vote_margin: 0

dsfl_temperature: 0.1

checkpoint_interval: 1
checkpoint_rounds: [10, 25, 50]
logging_interval: 1
log_every_batch: false

client_num_cpus: 1.0
client_num_gpus: 0.125 # 8 concurrent ClientApp actors on one 24-GB RTX 3090
max_concurrent_clients: 8
