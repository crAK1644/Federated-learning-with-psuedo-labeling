# Two-round smoke for all three experiment-1 arms, in the order the full matrix runs them.
#
# Operational gate only. It must pass on the same commit the full matrix will run on, and nothing
# it shows may be used to retune a Dawid-Skene setting (DENEY_1_SCENARIO_3_DENEY_PLANI.md
# section 11). What to check afterwards, per run directory:
#
#   num_proposals == 89 and rejected_count == 0 on every round
#   ds_applied == 1 on every round of the DS-only arm, and ds_status is never a numerical failure
#   ds_valid_mask_match == 1 on both Dawid-Skene arms
#   the hybrid arm's ds_status is recorded whichever way the round went
#   aggregation_audit/ contains annotations and dawid_skene_confusion for every round
#   the per-round wall clock, to size the 600-round budget
# Set this on the machine that prepares the data, BEFORE the first arm starts, and do not touch it
# again until all three have finished. run_suite refuses to start any entry whose
# artifacts/data/dataset_manifest.json hashes to something else, which is the only thing that
# catches a partition re-prepared between arms -- every run would still succeed, and the three arms
# simply would not be comparable.
#
# It is deliberately empty in git: manifest_hash covers the git commit and the checksums of the
# generated allocation plots, so it is local to one machine at one commit and a value copied from
# another checkout can never match. Fill it in with:
#
#   python3 -c "import json;print(json.load(open('artifacts/data/dataset_manifest.json'))['manifest_hash'])"
#
# Leave it empty and the check is simply skipped.
dataset_manifest_hash:

# Round count and checkpoint schedule are the ONLY overrides. Everything an arm is defined by --
# aggregation mode, estimator settings, gates, seed, partition -- comes from the same three
# profiles the full matrix runs, so a gate that passes here is a gate on the real configuration.
entries:
  - name: experiment1_s3_mv_smoke
    base_profile: experiment1_s3_mv
    overrides: {num_server_rounds: 2, checkpoint_rounds: [1, 2]}
  - name: experiment1_s3_ds_only_smoke
    base_profile: experiment1_s3_ds_only
    overrides: {num_server_rounds: 2, checkpoint_rounds: [1, 2]}
  - name: experiment1_s3_hybrid_smoke
    base_profile: experiment1_s3_hybrid
    overrides: {num_server_rounds: 2, checkpoint_rounds: [1, 2]}
