# Controlled target-pair experiment, base profile (section 5 of DAWID_SKENE_SONRAKI_ADIMLAR.md).
#
# The question this design exists to answer is narrow: given a class pair that is genuinely hard
# for a linear model and genuinely separable for a non-linear one, does label aggregation change
# what the federation learns about it? Everything that is not client specialization on that pair
# is held fixed -- open set, test set, backbone, optimizer, learning rate, round count, and the
# number of private rows each client holds. Scenario 4 is what makes the last one true: at any
# specialization level every client gets exactly `private_count` rows, so an arm difference can
# never be a data-volume difference (src/ssfl/data/partition.py).
#
# This is configs/dawid_skene_shadow.yaml with three changes and no others:
#
#   scenario             1 -> 4                        the controlled partition
#   ssfl_hard_aggregation shadow -> majority           this is the control arm
#   data_path            artifacts/data -> per-arm     each distribution is its own prepared root
#
# The pair is gafgyt.combo (1) / gafgyt.junk (2), chosen on measured evidence in stage 4:
# linear 0.686, forest 0.998, 1-NN 0.998 head-to-head on the sealed test split, held by 16 and 9
# clients, 900 open-set samples each. gafgyt.tcp / gafgyt.udp is the negative control and must
# NOT be used here -- float32 collapse makes it unlearnable for reasons that have nothing to do
# with aggregation.
#
# Prepare the two roots first (same seed, same splits, same scaler -- only the client assignment
# manifest differs):
#
#   uv run python -m ssfl.data.prepare_data --input data --output artifacts/data-balanced \
#       --seed 2023 --target-classes 1 2 --target-specialization 0.0
#   uv run python -m ssfl.data.prepare_data --input data --output artifacts/data-specialist \
#       --seed 2023 --target-classes 1 2 --target-specialization 1.0
profile: controlled_pair
run_kind: extension
algorithm: ssfl
backbone: cnn
scenario: 4
seed: 2023

# Overridden per entry in configs/experiments_controlled_pair.yaml.
data_path: artifacts/data-balanced
output_path: artifacts/runs

num_server_rounds: 50
local_epochs: 5
batch_size: 80
paper_text_batch: false
learning_rate: 1.0e-4
device: cuda
deterministic: true

ssfl_threshold_policy: median
ssfl_discriminator_mode: enabled
ssfl_voting_mode: enabled
ssfl_label_representation: hard
ssfl_soft_label_round_decimals: null

# --- aggregation ------------------------------------------------------------------------------
# Control arm. The shadow and active entries override this key and nothing else, so the three arms
# share a seed, a partition and a schedule; whatever separates them is the aggregator.
ssfl_hard_aggregation: majority

dawid_skene_warmup_rounds: 0
dawid_skene_max_iterations: 100
dawid_skene_min_iterations: 2
dawid_skene_tolerance: 1.0e-6
dawid_skene_initialization_pseudocount: 0.01
dawid_skene_confusion_pseudocount: 0.1
dawid_skene_class_prior_pseudocount: 1.0
dawid_skene_min_item_annotations: 1
dawid_skene_min_client_annotations: 1
dawid_skene_min_clients: 3
dawid_skene_posterior_threshold: 0.0
dawid_skene_damping: 1.0
dawid_skene_epsilon: 1.0e-12
dawid_skene_warm_start: false
dawid_skene_permutation_min_diagonal_ratio: 0.7
dawid_skene_permutation_min_majority_agreement: 0.5
# Restricted diagnostic. On at the rounds scripts/round_metrics.py reports, and deleted once the
# experiment is settled -- per-client confusion matrices ride the same gate.
dawid_skene_save_annotations: true
dawid_skene_annotation_rounds: [1, 10, 25, 41, 50]

dsfl_temperature: 0.1

checkpoint_interval: 1
checkpoint_rounds: [10, 25, 50]
logging_interval: 1
log_every_batch: false

client_num_cpus: 1.0
client_num_gpus: 0.125
max_concurrent_clients: 8
