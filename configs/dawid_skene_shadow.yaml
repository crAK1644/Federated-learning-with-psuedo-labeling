# Dawid-Skene shadow arm: fit the estimator on the live proposals, broadcast majority anyway.
#
# This is the control arm of the staged experiment in output/pdf/dawid_skene_server_changes.pdf.
# Shadow must change no broadcast byte and consume no RNG -- that is asserted by
# tests/unit/test_strategy_dawid_skene.py, not merely intended. Use it to measure convergence,
# disagreement, latency, and permutation-check behaviour before any Dawid-Skene label reaches
# training.
#
# run_kind: extension is enforced by ExperimentConfig: these runs must never land in canonical
# paper cells.
profile: dawid_skene_shadow
run_kind: extension
algorithm: ssfl
backbone: cnn
scenario: 1
seed: 2023

data_path: artifacts/data
output_path: artifacts/runs

num_server_rounds: 50
local_epochs: 5
batch_size: 80
paper_text_batch: false
learning_rate: 1.0e-4
# cuda, not auto: auto silently falls back to CPU, which on this workload looks like a slow run
# rather than a misconfigured one. A missing GPU must fail the run, not quietly change the arm.
device: cuda
deterministic: true

ssfl_threshold_policy: median
ssfl_discriminator_mode: enabled
ssfl_voting_mode: enabled
ssfl_label_representation: hard
ssfl_soft_label_round_decimals: null

# --- Dawid-Skene -------------------------------------------------------------------------------
# Initial engineering values for review, not defaults reported by Dong et al. The confirmatory
# values are chosen by the offline Stage 0 screen (scripts/ds_stage0.py), not tuned in live runs.
ssfl_hard_aggregation: dawid_skene_shadow
dawid_skene_warmup_rounds: 0
dawid_skene_max_iterations: 100
dawid_skene_min_iterations: 2
dawid_skene_tolerance: 1.0e-6
dawid_skene_initialization_pseudocount: 0.01
dawid_skene_confusion_pseudocount: 0.1
dawid_skene_class_prior_pseudocount: 1.0
dawid_skene_min_item_annotations: 1
dawid_skene_min_client_annotations: 1
dawid_skene_min_clients: 3
dawid_skene_posterior_threshold: 0.0
dawid_skene_damping: 1.0
dawid_skene_epsilon: 1.0e-12
dawid_skene_warm_start: false
dawid_skene_permutation_min_diagonal_ratio: 0.7
dawid_skene_permutation_min_majority_agreement: 0.5
# Restricted diagnostic: the client-by-sample label matrix. On only for the Stage 0 rounds, and
# the audit is deleted once settings are locked (DATA_CARD.md / the approval brief's safeguards).
#
# On for this run, and this is its main product. The Stage 0 screen so far has only seen round-1/2
# annotations from a barely-trained model; whether Dawid-Skene helps or hurts once clients have
# converged is a different question, and these four snapshots are what answers it offline --
# without spending a live active run to find out.
dawid_skene_save_annotations: true
dawid_skene_annotation_rounds: [1, 10, 25, 50]

dsfl_temperature: 0.1

# Matched to the gpu50_baseline run this arm is compared against. Interval 1 because resume is not
# wired into server_app yet (REPRODUCIBILITY.md #27): an interrupted run restarts from round 1, so
# the checkpoints are the only record of a partial run.
checkpoint_interval: 1
checkpoint_rounds: [10, 25, 50]
logging_interval: 1
log_every_batch: false

client_num_cpus: 1.0
# 8 concurrent clients x 0.125 = one full GPU. At 0.0 Ray hides the GPU from the actors entirely
# and every client trains on CPU regardless of `device`.
client_num_gpus: 0.125
max_concurrent_clients: 8
