    overrides: {algorithm: ssfl, backbone: cnn, scenario: 2, seed: 2024, ssfl_label_representation: soft, ssfl_voting_mode: disabled, ssfl_soft_label_round_decimals: 4}
  - name: collapse_soft_s2_seed2025
