  - name: collapse_margin2_s1_seed2023
    base_profile: collapse_probe
    overrides: {algorithm: ssfl, backbone: cnn, scenario: 1, seed: 2023, ssfl_vote_margin: 2}
  - name: collapse_margin2_s1_seed2024
    base_profile: collapse_probe
    overrides: {algorithm: ssfl, backbone: cnn, scenario: 1, seed: 2024, ssfl_vote_margin: 2}
  - name: collapse_margin2_s1_seed2025
    base_profile: collapse_probe
    overrides: {algorithm: ssfl, backbone: cnn, scenario: 1, seed: 2025, ssfl_vote_margin: 2}
  - name: collapse_margin2_s2_seed2023
    base_profile: collapse_probe
    overrides: {algorithm: ssfl, backbone: cnn, scenario: 2, seed: 2023, ssfl_vote_margin: 2}
  - name: collapse_margin2_s2_seed2024
