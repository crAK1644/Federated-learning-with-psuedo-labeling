# Dawid-Skene active arm at full paper length: broadcast the Dawid-Skene labels when the fit
# succeeds, majority when it does not. 200 rounds, ~8 h on one RTX 3090 at 144 s/round.
#
# configs/dawid_skene_active.yaml at 200 rounds. Only run_kind still differs from
# configs/paper.yaml (extension, forced by ExperimentConfig for non-majority aggregation).
#
# THIS ARM NEEDS A MATCHED CONTROL AND DOES NOT CARRY ONE. No post-#34 200-round baseline exists --
# gpu50_baseline is 50 rounds and predates the determinism fix. Run this against
# configs/dawid_skene_shadow_200.yaml (same seed, same data, broadcasts majority bit-identically),
# not against any run made before #34, or the comparison silently mixes a 19.6-point protocol
# effect with a noise floor that disagreed on 6925 of 8900 round-1 vote vectors.
#
# WHAT THE 50-ROUND TRIAL ALREADY SETTLED. Active finished at 0.5380 against majority's 0.7335, a
# -19.6 point cost, with benign recall 0.994 -> 0.000. #36 traced it to non-identifiable class
# pairs -- at round 50, zero clients voted on both benign and gafgyt.scan, so one latent class
# explains both and merging them raises the likelihood. The fit beats sealed ground truth on the
# estimator's own objective by +3155 log-units, which is why no hyperparameter changes it.
#
# WHAT 200 ROUNDS ADDS. Two things the 50-round run could not show. (1) Whether client coverage
# broadens as the global model converges, closing the blind pairs and restoring identifiability --
# the one route by which this arm recovers for a stated reason. (2) Whether the feedback loop
# compounds: active broadcasts merged labels, clients train on them, and the classes DS merged may
# become genuinely indistinguishable to the clients themselves. Shadow cannot show (2) at all,
# because it never broadcasts a Dawid-Skene label. The annotation snapshots below measure both.
profile: dawid_skene_active_200
run_kind: extension
algorithm: ssfl
backbone: cnn
scenario: 1
seed: 2023

data_path: artifacts/data
output_path: artifacts/runs

num_server_rounds: 200
local_epochs: 5
batch_size: 80
paper_text_batch: false
learning_rate: 1.0e-4
# cuda, not auto: auto silently falls back to CPU, which on this workload looks like a slow run
# rather than a misconfigured one. A missing GPU must fail the run, not quietly change the arm.
device: cuda
deterministic: true

ssfl_threshold_policy: median
ssfl_discriminator_mode: enabled
ssfl_voting_mode: enabled
ssfl_label_representation: hard
ssfl_soft_label_round_decimals: null

# --- Dawid-Skene -------------------------------------------------------------------------------
# Unchanged from the 50-round trial, and deliberately not retuned -- see the note in
# configs/dawid_skene_shadow_200.yaml. Retuning here would also make this arm incomparable to the
# shadow control it is paired with.
ssfl_hard_aggregation: dawid_skene
dawid_skene_warmup_rounds: 0
dawid_skene_max_iterations: 100
dawid_skene_min_iterations: 2
dawid_skene_tolerance: 1.0e-6
dawid_skene_initialization_pseudocount: 0.01
dawid_skene_confusion_pseudocount: 0.1
dawid_skene_class_prior_pseudocount: 1.0
dawid_skene_min_item_annotations: 1
dawid_skene_min_client_annotations: 1
dawid_skene_min_clients: 3
dawid_skene_posterior_threshold: 0.0
dawid_skene_damping: 1.0
dawid_skene_epsilon: 1.0e-12
dawid_skene_warm_start: false
dawid_skene_permutation_min_diagonal_ratio: 0.7
dawid_skene_permutation_min_majority_agreement: 0.5
# Restricted diagnostic, same terms as the shadow arm: pseudonymized by sender index, off by
# default, deleted once the question is settled. Matched to shadow's schedule so the two arms'
# coverage structure can be compared round for round -- that comparison is the whole point of
# dumping on this arm, since it isolates what the feedback loop does to coverage.
dawid_skene_save_annotations: true
dawid_skene_annotation_rounds: [1, 25, 50, 100, 150, 200]

dsfl_temperature: 0.1

# Interval 1 because resume is not wired into server_app yet (REPRODUCIBILITY.md #27): an
# interrupted run restarts from round 1, so the checkpoints are the only record of a partial run.
checkpoint_interval: 1
checkpoint_rounds: [10, 50, 100, 150, 200]
logging_interval: 1
log_every_batch: false

client_num_cpus: 1.0
# 8 concurrent clients x 0.125 = one full GPU. Measured GPU utilization at this setting is 94.8%
# mean / 98% median -- the card is saturated, so parallel arms gain nothing.
client_num_gpus: 0.125
max_concurrent_clients: 8
