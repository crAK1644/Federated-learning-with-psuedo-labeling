# Experiment 1: majority vs Dawid-Skene-only vs hybrid on scenario 3, seed 2023, 200 rounds each.
#
# The research question is whether combining client pseudo-labels with Dawid-Skene produces a
# better global model than majority vote under identical federated conditions. Aggregation is the
# only thing that differs between the three entries; each arm carries its settings in its own
# profile rather than as an override here, because the two Dawid-Skene arms differ in more than one
# key and an override list that long stops being readable as "one thing changed".
#
# ORDER. Majority first: it is the reference the other two are read against and the only entry
# interpretable standing alone. Then DS-only, then hybrid. Sequential, never parallel -- eight
# concurrent clients at 0.125 GPU each already saturate the card, so overlapping arms only halves
# each one's throughput.
#
# BUDGET. 3 x 200 = 600 communication rounds. At the ~144 s/round measured on this hardware at
# these settings that is roughly 8 h per arm and 24 h end to end.
#
# BEFORE STARTING. The code and configs freeze here. If either changes after an arm has run, that
# arm's result is not comparable to the others and all three rerun -- see section 3 of
# DENEY_1_SCENARIO_3_DENEY_PLANI.md. Confirm first that the two-round smoke matrix
# (configs/experiments_experiment1_s3_smoke.yaml) passed on this same commit, and that
# Set this on the machine that prepares the data, BEFORE the first arm starts, and do not touch it
# again until all three have finished. run_suite refuses to start any entry whose
# artifacts/data/dataset_manifest.json hashes to something else, which is the only thing that
# catches a partition re-prepared between arms -- every run would still succeed, and the three arms
# simply would not be comparable.
#
# It is deliberately empty in git: manifest_hash covers the git commit and the checksums of the
# generated allocation plots, so it is local to one machine at one commit and a value copied from
# another checkout can never match. Fill it in with:
#
#   python3 -c "import json;print(json.load(open('artifacts/data/dataset_manifest.json'))['manifest_hash'])"
#
# Leave it empty and the check is simply skipped.
dataset_manifest_hash:

entries:
  - name: experiment1_s3_mv_200
    base_profile: experiment1_s3_mv
  - name: experiment1_s3_ds_only_200
    base_profile: experiment1_s3_ds_only
  - name: experiment1_s3_hybrid_200
    base_profile: experiment1_s3_hybrid
